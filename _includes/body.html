<div id="mx-nudge" role="dialog" aria-label="Recibe los recursos del taller">
  <button class="mx-close" type="button" aria-label="Cerrar">&times;</button>
  <h4>Llévate el taller a tu correo</h4>
  <p>Una serie corta de correos con los <i>prompts</i>, la checklist y recursos extra para tu investigación.</p>
  <form class="mx-form" data-list="talleria">
    <input type="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
    <button type="submit">Enviar</button>
  </form>
  <div class="mx-msg" aria-live="polite"></div>
</div>
<script>
(function () {
  // Notifuse: mismo servidor y workspace que el formulario de marionomics.com
  var NOTIFUSE = "https://tangerine-puma.pikapod.net";
  var WORKSPACE = "marionomics";
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function subscribe(email, list) {
    var tz = "America/Monterrey";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
    return fetch(NOTIFUSE + "/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ workspace_id: WORKSPACE, list_ids: [list], contact: { email: email, timezone: tz } })
    }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r; });
  }
  window.mxSubscribe = subscribe;

  // Cualquier formulario .mx-form de la página (el aviso flotante o los que van dentro del contenido)
  document.addEventListener("submit", function (ev) {
    var form = ev.target;
    if (!form.classList || !form.classList.contains("mx-form")) return;
    ev.preventDefault();
    var email = form.querySelector("input[type=email]").value.trim();
    var btn = form.querySelector("button");
    var msg = form.parentNode.querySelector(".mx-msg");
    btn.disabled = true;
    subscribe(email, form.getAttribute("data-list") || "talleria").then(function () {
      if (msg) msg.textContent = "¡Listo! Revisa tu correo para confirmar tu suscripción.";
      form.style.display = "none";
      store("mx-subscribed", "1");
    }).catch(function () {
      if (msg) msg.textContent = "No se pudo registrar tu correo. Intenta de nuevo en un momento.";
      btn.disabled = false;
    });
  });

  // Aviso flotante: aparece tras 40 s o al recorrer media página, una vez cada 7 días
  var nudge = document.getElementById("mx-nudge");
  function canShow() {
    if (store("mx-subscribed")) return false;
    var last = parseInt(store("mx-nudge-closed") || "0", 10);
    return Date.now() - last > 7 * 24 * 3600 * 1000;
  }
  function show() { if (nudge && canShow() && !/\/unirme\/?$/.test(location.pathname)) nudge.classList.add("show"); }
  if (nudge) {
    nudge.querySelector(".mx-close").addEventListener("click", function () { nudge.classList.remove("show"); store("mx-nudge-closed", String(Date.now())); });
    setTimeout(show, 40000);
    window.addEventListener("scroll", function onScroll() {
      var h = document.documentElement;
      if ((h.scrollTop + window.innerHeight) / h.scrollHeight > 0.5) { show(); window.removeEventListener("scroll", onScroll); }
    }, { passive: true });
  }

  // Página /unirme/: el enlace del último correo del taller trae ?email=... y la inscribe en El Mapa (lista fullstack)
  function joinPage() {
    var box = document.getElementById("mx-join");
    if (!box || box.getAttribute("data-done")) return;
    box.setAttribute("data-done", "1");
    var email = new URLSearchParams(location.search).get("email");
    var out = box.querySelector(".mx-msg");
    if (!email) { box.querySelector(".mx-form").style.display = ""; return; }
    out.textContent = "Registrando " + email + "…";
    subscribe(email, box.getAttribute("data-list")).then(function () {
      out.textContent = "¡Listo! Ya estás inscrito en El Mapa. Tu primer correo va en camino.";
      store("mx-subscribed", "1");
    }).catch(function () {
      out.textContent = "No se pudo registrar automáticamente. Escribe tu correo aquí:";
      box.querySelector(".mx-form").style.display = "";
    });
  }
  document.addEventListener("DOMContentLoaded", joinPage);
  document.addEventListener("turbo:load", joinPage);
  if (document.readyState !== "loading") joinPage();
})();
</script>
